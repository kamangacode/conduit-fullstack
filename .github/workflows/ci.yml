name: CI

# Pipeline d'intégration continue. Miroir distant des garde-fous locaux
# (lefthook) : ce qui bloque un push doit bloquer une PR, et inversement.
#
# Un seul check requis pour la protection de branche : `ci-success`. Il agrège
# le résultat des jobs et réussit même quand certains sont skippés (diff sans
# code) — indispensable pour ne pas bloquer une PR de doc pure.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  schedule:
    # Filet de sécurité hebdomadaire (lundi 03:00 UTC) : rejoue l'audit de
    # vulnérabilités même sans changement de code, pour attraper une CVE publiée
    # sur une dépendance déjà installée.
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Principe du moindre privilège : la CI lit, elle n'écrit pas.
permissions:
  contents: read

concurrency:
  # event_name dans le groupe : un run push et un run pull_request sur le même
  # ref ne s'annulent pas mutuellement (chaque déclencheur a sa voie).
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Pas de diff à filtrer sur un run planifié (cron) : seul l'audit s'y déclenche.
    if: github.event_name != 'schedule'
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'biome.json'
              - 'knip.json'
              - '.dependency-cruiser.cjs'
              - 'tsconfig*.json'
              - 'turbo.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'apps/**/package.json'
              - 'packages/**/package.json'

  quality:
    name: Quality (lint + knip + boundaries)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          # Le check des raisons de biome-ignore diffe contre la base : besoin de l'historique.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (format + lint)
        run: pnpm lint
      - name: Verrou hard-fail Biome (vérification active)
        run: bash scripts/verify-biome-hardfail.sh
      - name: Raisons des biome-ignore (PR uniquement)
        if: github.event_name == 'pull_request'
        # Garantit que la ref de base est résolvable côté runner : le script
        # échoue désormais bruyamment si elle ne l'est pas (plus de no-op silencieux).
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          bash scripts/check-biome-ignore-reasons.sh "origin/${{ github.base_ref }}"
      - name: Code mort (knip)
        run: pnpm knip
      - name: Frontières hexagonales (dependency-cruiser)
        run: pnpm depcruise

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cache Turbo par job + sha, restauré depuis le dernier run du même job (D3).
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-
      # Vacant tant que les suites Vitest n'existent pas (Phase 4) — reste vert.
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      - run: pnpm build

  audit:
    name: Audit vulnérabilités
    runs-on: ubuntu-latest
    needs: detect-changes
    # Sur le cron hebdomadaire, ou dès qu'un manifeste/lockfile change. always()
    # pour évaluer la condition même quand detect-changes est skippé (cron).
    if: always() && (github.event_name == 'schedule' || needs.detect-changes.outputs.deps == 'true')
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vulnérabilités de sévérité 'high' et plus, sur les deps de production.
      # Hors ci-success à dessein : filet de sécurité, pas un gate bloquant sur
      # une CVE transitive apparue en dehors du périmètre de la PR.
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level=high

  ci-success:
    name: CI success
    # L'unique check requis pour la protection de branche. Toujours exécuté pour
    # produire un statut, même si des jobs amont sont skippés (diff sans code).
    if: always()
    runs-on: ubuntu-latest
    needs: [detect-changes, quality, typecheck, test, build]
    steps:
      - name: Vérifie qu'aucun job requis n'a échoué
        run: |
          for r in \
            "${{ needs.quality.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "Un job requis a échoué (statut: $r)."
              exit 1
            fi
          done
          echo "Tous les jobs requis sont passés (ou skippés faute de changement de code)."
