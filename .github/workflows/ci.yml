name: CI

# Pipeline d'intégration continue. Miroir distant des garde-fous locaux
# (lefthook) : ce qui bloque un push doit bloquer une PR, et inversement.
#
# Un seul check requis pour la protection de branche : `ci-success`. Il agrège
# le résultat des jobs et réussit même quand certains sont skippés (diff sans
# code) — indispensable pour ne pas bloquer une PR de doc pure.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  schedule:
    # Filet de sécurité hebdomadaire (lundi 03:00 UTC) : rejoue l'audit de
    # vulnérabilités même sans changement de code, pour attraper une CVE publiée
    # sur une dépendance déjà installée.
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Principe du moindre privilège : la CI lit, elle n'écrit pas.
permissions:
  contents: read

concurrency:
  # event_name dans le groupe : un run push et un run pull_request sur le même
  # ref ne s'annulent pas mutuellement (chaque déclencheur a sa voie).
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Pas de diff à filtrer sur un run planifié (cron) : seul l'audit s'y déclenche.
    if: github.event_name != 'schedule'
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
      adr: ${{ steps.filter.outputs.adr }}
      requirements: ${{ steps.filter.outputs.requirements }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'biome.json'
              - 'knip.json'
              - '.dependency-cruiser.cjs'
              - 'tsconfig*.json'
              - 'turbo.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'apps/**/package.json'
              - 'packages/**/package.json'
            adr:
              - 'docs/adr/**'
              - 'scripts/check-adr-index.sh'
            docs:
              # Tout markdown versionné : un lien meurt aussi bien quand on
              # l'écrit que quand on **renomme sa cible**, et le fichier renommé
              # n'est alors pas celui qui porte le lien.
              - '**/*.md'
              # Le contrôle et son harnais : les modifier doit les rejouer.
              - 'scripts/check-doc-links.sh'
              - 'scripts/verify-doc-links.sh'
            requirements:
              - 'docs/requirements/**'
              # Le validateur vérifie l'existence des fichiers référencés par les
              # REQ : supprimer un test cité par un REQ `implemented` doit faire
              # échouer ce job, donc tout changement de code le déclenche aussi.
              - 'apps/**'
              - 'packages/**'
              # `scripts/**` en entier, et pas seulement les vérificateurs du
              # référentiel : plusieurs exigences non fonctionnelles ont leur
              # preuve dans un script shell (REQ-ARCH-001, REQ-CONF-001), donc
              # en supprimer un doit rougir ici. Le filtre ne listait que
              # `verify-requirements-validator.sh`, ce qui laissait ces preuves
              # supprimables sans que le job ne se déclenche.
              - 'scripts/**'

  quality:
    name: Quality (lint + knip + boundaries)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          # Le check des raisons de biome-ignore diffe contre la base : besoin de l'historique.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (format + lint)
        run: pnpm lint
      - name: Verrou hard-fail Biome (vérification active)
        run: bash scripts/verify-biome-hardfail.sh
      - name: Garde-fou de secrets (vérification active)
        # Le hook pre-commit ne protège que celui qui l'a installé. Rejouer le
        # canary ici prouve que le garde-fou mord aussi sur un runner frais,
        # et attrape le cas où quelqu'un aurait dégradé ses motifs (REQ-SEC-001).
        run: bash scripts/verify-secret-guard.sh
      - name: Éligibilité auto-merge (vérification active)
        # Rejoue le refus de la promotion `staging → main` sur un runner frais
        # (REQ-RELEASE-002, ADR 030). La propriété gardée ici — un squash de
        # promotion ferait sauter la release — a un symptôme différé de plusieurs
        # jours ; c'est exactement le genre de garde-fou dont l'absence ne se
        # remarque qu'une fois le dégât fait.
        run: bash scripts/verify-auto-merge-eligibility.sh
      - name: Sujet conventionnel (vérification active)
        # Le hook `commit-msg` qui refuse un sujet non conventionnel ne tourne
        # que sur le poste, et `--no-verify` suffit à le contourner. Rejouer ici
        # ses refus prouve que la règle mord encore, et surtout qu'elle est la
        # **même** des deux côtés : la vérification échoue si le hook ou
        # `pr-title.yml` cessait d'appeler le script partagé (REQ-RELEASE-001,
        # ADR 029).
        run: bash scripts/verify-conventional-subject.sh
      - name: Verrou SQL brut (vérification active)
        # Le plugin GritQL qui interdit `$queryRawUnsafe` se dégrade en silence :
        # s'il ne compile pas, Biome le rapporte en `info` et sort en 0. Rejouer
        # ici ses refus prouve qu'il mord encore sur un runner frais, plutôt que
        # de constater qu'il est déclaré (REQ-SEC-002, ADR 024).
        run: bash scripts/verify-sql-raw-guard.sh
      - name: Fail-fast de configuration (vérification active)
        # Démarre le point d'entrée réel sur cinq configurations invalides et
        # exige un arrêt qui nomme la variable (REQ-SEC-004, ADR 025).
        #
        # Ce runner est le seul endroit où la propriété se mesure sans biais : il
        # n'a pas de `.env`, là où le poste du développeur en porte un qui masquait
        # précisément le défaut — la validation s'exécutait après le chargement du
        # graphe, donc après que `@prisma/client` ait chargé le fichier. Le script
        # écrit sa propre fixture `.env` pour que le cas soit joué ici aussi.
        #
        # Passé par turbo, et non appelé directement : démarrer le vrai point
        # d'entrée exige le client Prisma et `@repo/shared` compilé, que la tâche
        # déclare en `dependsOn`. La première version de cette étape appelait le
        # script en direct et a échoué ici sur `MODULE_NOT_FOUND: @repo/shared`
        # en passant en local, où le build traînait d'un run précédent — réparer
        # le graphe plutôt que le job, comme pour `db:generate` et l'Integration.
        run: pnpm exec turbo run verify:env-fail-fast
      - name: Raisons des biome-ignore (PR uniquement)
        if: github.event_name == 'pull_request'
        # Garantit que la ref de base est résolvable côté runner : le script
        # échoue désormais bruyamment si elle ne l'est pas (plus de no-op silencieux).
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          bash scripts/check-biome-ignore-reasons.sh "origin/${{ github.base_ref }}"
      - name: Le job E2E bloque bien la CI (vérification active)
        # Rejoué ici, et non dans le job e2e : un job qu'on aurait désactivé
        # emporterait avec lui le contrôle de sa propre blocance. Le filtre
        # `code` de `detect-changes` liste `ci.yml`, donc toute PR qui touche au
        # workflow réveille cette vérification (REQ-CONF-002 AC-5).
        run: node scripts/check-e2e-gate-wiring.mjs
      - name: Code mort (knip)
        run: pnpm knip
      - name: Frontières hexagonales (dependency-cruiser)
        run: pnpm depcruise

  adr:
    name: Convention ADR
    runs-on: ubuntu-latest
    needs: detect-changes
    # Job séparé du job `quality` (et non une étape de plus) : une PR qui ne
    # touche QUE des ADR ne déclenche pas le filtre `code`, donc elle passerait
    # sous le radar de `quality`. Ici, pas d'installation de dépendances — un
    # checkout et un script bash, quelques secondes.
    if: needs.detect-changes.outputs.adr == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Numérotation, sections et index des ADR
        run: bash scripts/check-adr-index.sh

  doc-links:
    name: Liens de documentation
    runs-on: ubuntu-latest
    needs: detect-changes
    # Même raison que le job `adr` d'être séparé de `quality` : une PR de
    # documentation pure ne déclenche pas le filtre `code`, et c'est précisément
    # la PR où un lien meurt. Le brancher sur `quality` aurait laissé le cas le
    # plus probable hors de la CI, en contradiction avec l'invariant que ce
    # fichier revendique dès son en-tête — ce qui bloque un push doit bloquer
    # une PR. Pas d'installation de dépendances : un checkout, git et bash.
    if: needs.detect-changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Aucun lien relatif vers un fichier non versionné
        # Le runner est le seul endroit où la propriété se mesure sans biais :
        # il ne porte que ce que git porte, là où le poste du rédacteur porte
        # aussi le cadre local `.claude/` qui rend le lien fautif vert chez lui
        # (REQ-DOC-001 AC-2).
        run: bash scripts/check-doc-links.sh
      - name: Contrôle des liens (vérification active)
        # Un vérificateur de liens est vert quand tout va bien ET vert quand il
        # ne regarde rien. Rejouer ses refus prouve qu'il mord encore.
        run: bash scripts/verify-doc-links.sh

  requirements:
    name: Requirements
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.requirements == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ces scripts vivent hors des workspaces pnpm : `pnpm typecheck` (turbo) ne
      # les couvre pas. Sans cette étape, tsx les exécuterait sans que personne
      # n'ait jamais vérifié leurs types.
      - name: Typecheck des scripts d'exigences
        run: pnpm requirements:typecheck
      - name: Exigences (schéma Zod + intégrité des liens)
        run: pnpm requirements:validate
      # Le méta-test : sans lui, un validateur qui accepterait tout — ou une
      # matrice qui afficherait « aucun test » partout — passerait les étapes
      # précédentes avec les honneurs. ~10 s, le prix d'un garde-fou dont on
      # sait qu'il garde.
      - name: Vérification active du validateur et de la matrice (fixtures)
        run: pnpm requirements:verify
      # Rapport, jamais gate (ADR 005) : la matrice n'est pas committée, donc on
      # publie le tableau de couverture dans le résumé du run pour qu'il reste
      # lisible depuis la PR sans permission d'écriture.
      - name: Couverture AC-level (rapport)
        run: |
          {
            echo "## Couverture des exigences"
            echo ""
            pnpm --silent requirements:coverage
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cache Turbo par job + sha, restauré depuis le dernier run du même job (D3).
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      - run: pnpm typecheck
      # Vérification active de la thèse du dépôt : casser le modèle partagé doit
      # faire échouer `apps/api` ET `apps/web` (REQ-ARCH-001). Placée après le
      # typecheck ordinaire, dont elle réutilise le cache — et qui sert de
      # référence : le script refuse de conclure si le dépôt ne compile pas déjà.
      - name: Frontière typée bout-en-bout (vérification active)
        run: bash scripts/verify-type-boundary.sh
      # Moitié « compilation » des tests de contrat (REQ-ARCH-002 AC-6/AC-7) :
      # retirer un champ du contrat de la projection réelle doit faire refuser
      # `tsc`. Passe par le graphe turbo, qui déclare `^build` et `db:generate` —
      # la vérification relance un typecheck, donc elle a besoin des mêmes
      # artefacts qu'un typecheck ordinaire.
      - name: Producteur des réponses lié au contrat (vérification active)
        run: pnpm exec turbo run verify:contract-types

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-
      # `test:coverage` plutôt que `test` : la CI exécute les mêmes tests, en
      # instrumentés. Les lancer deux fois pour obtenir le chiffre serait payer
      # la suite entière pour rien.
      - run: pnpm test:coverage
      # Sans service externe (ADR 006) : le rapport détaillé part en artefact
      # téléchargeable, la synthèse s'affiche dans le résumé du run — lisible
      # sans quitter la PR, et sans token à faire tourner.
      - name: Synthèse de couverture
        if: always()
        run: |
          {
            echo "## Couverture des tests"
            echo ""
            bash scripts/coverage-summary.sh
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Rapport de couverture (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 14
          if-no-files-found: warn

  integration:
    name: Integration (PostgreSQL réelle)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    services:
      # Base jetable fournie par le runner : le script détecte
      # `TEST_DATABASE_URL` et ne touche alors pas à Docker (même chemin de code
      # qu'en local, sans la partie compose).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conduit -d conduit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Passe par turbo, et non par `bash scripts/test-integration.sh` : c'est le
      # graphe qui doit fournir les prérequis. `test:integration` y déclare
      # `dependsOn: ["^build", "db:generate"]`, donc le client Prisma ET le build
      # de `@repo/shared` sont produits avant la suite.
      #
      # Appeler le script directement les contournait tous les deux. Le client
      # Prisma était compensé par une étape manuelle ; le build de `@repo/shared`
      # ne l'était par rien, et la panne est restée invisible tant qu'aucune spec
      # d'intégration n'importait ce paquet. La première qui l'a fait a échoué sur
      # `Failed to resolve entry for package "@repo/shared"` — alors que tout
      # passait en local, où `dist/` traînait d'un build antérieur.
      #
      # Même leçon que pour `db:generate` : une étape ajoutée au job répare un
      # chemin et laisse ses frères ouverts, le graphe les répare tous.
      - name: Tests d'intégration (migrations + Vitest + purge)
        env:
          TEST_DATABASE_URL: postgresql://conduit:conduit@localhost:5432/conduit_test?schema=public
        run: pnpm test:integration

  conformance:
    name: Conformance (suite RealWorld officielle)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    services:
      # Base dédiée, distincte de celle du job `integration` : la suite
      # officielle exige une base vierge, et son nom doit contenir
      # « conformance » — la garde du script refuse de vider une base qui ne
      # s'annonce pas jetable.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conduit -d conduit_conformance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Hurl n'est pas un paquet npm : c'est un binaire, installé depuis la
      # release amont épinglée. Sans épinglage, une évolution de son format de
      # sortie ferait rougir un gate sans qu'aucune ligne du dépôt n'ait bougé.
      - name: Installer Hurl
        run: |
          curl -sfLO https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb
          sudo dpkg -i hurl_8.0.1_amd64.deb
          rm hurl_8.0.1_amd64.deb
      # Le gate : la suite officielle, en entier, contre l'artefact compilé.
      # Aucune dépendance réseau une fois la copie vendorée en place, donc rien
      # ici ne peut rougir à cause d'un tiers indisponible.
      - name: Suite de conformité RealWorld
        env:
          CONFORMANCE_DATABASE_URL: postgresql://conduit:conduit@localhost:5432/conduit_conformance?schema=public
        run: pnpm conformance
      # Le rapport, non bloquant, et volontairement APRÈS le gate : il dépend du
      # réseau, et faire rougir la CI de chaque PR parce qu'un tiers a publié un
      # commit ce matin produirait le gate qu'on désactive six mois plus tard
      # (rule 21, étape 3 : on mesure le bruit avant de gater). Le script, lui,
      # rend bien un code non nul sur une retouche locale — c'est la CI qui
      # choisit de ne pas encore en faire un gate.
      - name: Dérive de la copie vendorée (rapport)
        continue-on-error: true
        run: pnpm conformance:drift
      # Le contrôle du contrôle : éprouve que la détection de dérive sait
      # échouer. Un contrôle dont on n'a jamais constaté qu'il rougit ne protège
      # rien, et celui-ci garde la seule triche capable de vider la suite de son
      # sens. Non bloquant pour la même raison de dépendance réseau.
      - name: Modes de défaillance du contrôle de dérive
        continue-on-error: true
        run: pnpm conformance:verify

  e2e:
    name: E2E (suite Playwright officielle — gate)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    # **Ce job bloque** (REQ-CONF-002 AC-5, ADR 018) — depuis le 2026-08-07, et
    # pas depuis le premier jour. Il a d'abord tourné en rapport le temps de
    # mesurer son bruit, parce qu'il pilote un navigateur réel à travers
    # l'hydratation de Next : ses modes d'échec incluent des situations qui ne
    # disent rien de la conformité (un `waitForURL` qui expire sur un runner
    # chargé). Un seuil posé au jour 1 sur ce médium produit le gate qu'on
    # désactive six mois plus tard, et qui emporte alors dans sa chute les échecs
    # qui, eux, disaient quelque chose (rule 21, étapes 3 à 5).
    #
    # Ce qui a été mesuré avant de basculer, et qui justifie de le faire
    # maintenant plutôt que de le parier :
    #
    #   - **1 à 2 instables sur 139** pendant toute la phase de rapport, avec un
    #     ensemble d'échecs strictement identique d'un run à l'autre — donc un
    #     signal, pas du bruit (relevé dans l'issue #17) ;
    #   - **trois runs verts consécutifs sur `staging`** une fois l'epic #11
    #     fermée, dont un déclenché à la main sur un arbre inchangé : le taux
    #     d'instables se mesure sur une suite qui **passe**, pas sur une suite
    #     qui échoue déjà ;
    #   - les `retries: 2` de la configuration amont absorbent déjà un instable,
    #     et ce chiffre n'est **pas** relevé pour l'occasion — ce serait faire
    #     passer par la configuration ce qui doit passer par le code (rule 13).
    #
    # `scripts/check-e2e-gate-wiring.mjs` (job `Quality`) empêche que cette
    # propriété se défasse en silence : un `continue-on-error` remis « le temps
    # de déboguer » laisserait le job tourner et afficher son verdict sans que
    # rien ne change de couleur.
    services:
      # Troisième base dédiée, distincte de `conduit_test` (intégration) et
      # `conduit_conformance` (Hurl). Son nom doit contenir « e2e » : la garde du
      # script refuse de vider une base qui ne s'annonce pas jetable.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conduit -d conduit_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--with-deps` installe les bibliothèques système du navigateur, que le
      # runner ne porte pas toutes. Le script les réinstallerait sans, et
      # échouerait au lancement pour une raison sans rapport avec le front.
      - name: Installer le navigateur Playwright
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      # Le contrôle du contrôle, et il vient **avant** la suite : il vérifie que
      # le harnais collecte réellement des tests et qu'il sait rougir. Sans lui,
      # un `testDir` erroné rendrait « 0 test, code 0 » — le vert le plus creux
      # qu'un dépôt puisse afficher, et celui qu'on croirait.
      - name: Modes de défaillance du harnais e2e
        run: bash scripts/verify-e2e-gate.sh
      # Le même principe appliqué à l'étape de données : le jeu minimal que la
      # suite suppose doit être idempotent et savoir rougir (REQ-CONF-003 AC-2,
      # AC-3). Contre un stub d'API, donc quelques secondes et aucune dépendance
      # à la base ni au navigateur — les deux propriétés portent sur la séquence
      # d'appels du script, pas sur le comportement de l'API.
      - name: Idempotence du jeu de données e2e
        run: bash scripts/verify-e2e-seed.sh
      - name: Suite e2e RealWorld
        env:
          E2E_DATABASE_URL: postgresql://conduit:conduit@localhost:5432/conduit_e2e?schema=public
        # `pipefail` explicite : le shell par défaut des runners est `bash -e`,
        # sans lui. Le code de sortie du run serait donc celui de `tee`, donc 0,
        # et l'étape s'afficherait verte quel qu'ait été le verdict. C'était déjà
        # vrai en rapport ; sous le gate, c'est la ligne qui **fait** le gate —
        # le retrait des `continue-on-error` ne bloque rien si le code de sortie
        # observé est celui du dernier maillon du tube.
        run: |
          set -o pipefail
          pnpm conformance:e2e 2>&1 | tee /tmp/e2e.log
      # Le résumé survit à la bascule en gate, et son intérêt se déplace : il ne
      # sert plus à rendre lisible le verdict d'un job vert, mais à donner le
      # **compte** d'un job rouge sans ouvrir son journal — 1 échec sur 139 et 50
      # sur 139 se corrigent très différemment. `if: always()`, donc il s'écrit
      # aussi quand l'étape précédente vient de faire échouer le job : c'est
      # précisément le cas où on le lit.
      - name: Verdict e2e (résumé de run)
        if: always()
        run: |
          {
            echo "## Conformité e2e RealWorld (gate)"
            echo ""
            if grep -qE '^\s+[0-9]+ (passed|failed|flaky)' /tmp/e2e.log 2> /dev/null; then
              grep -E '^\s+[0-9]+ (passed|failed|flaky|skipped)' /tmp/e2e.log \
                | sed -E 's/^\s*/- /'
            else
              echo "_La suite n'a pas atteint son terme : voir le journal du job._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Les traces et captures d'écran sont ce qui rend un échec e2e
      # diagnosticable sans reproduire le run : sans elles, le rapport se réduit
      # à un nom de test et une ligne.
      - name: Rapport Playwright (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    name: Secrets (TruffleHog — rapport)
    runs-on: ubuntu-latest
    # **Aucun filtre de chemin, et c'est délibéré.** Les autres jobs se
    # déclenchent sur `code`, parce qu'un diff de documentation ne casse pas un
    # test. Un secret, lui, entre par n'importe quel fichier — un README, un
    # workflow, un fichier de configuration d'éditeur. Filtrer ici reviendrait à
    # ne pas regarder là où on ne s'attend pas à trouver, c'est-à-dire là où on
    # trouve.
    #
    # Skip sur le cron hebdomadaire : sans événement, la plage serait « toute
    # l'histoire », donc le même rapport tous les lundis sur des constats déjà
    # connus. Un rapport qui se répète à l'identique cesse d'être lu, et emporte
    # avec lui celui qui aurait dit quelque chose.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
        with:
          # Histoire complète : le scan travaille sur une plage de commits. Avec
          # la profondeur par défaut (1), `git rev-list base..head` ne résout
          # rien et le scan n'examinerait qu'un arbre sans passé — vert, et vide.
          fetch-depth: 0
      # Le contrôle du contrôle, et il vient **avant** le scan. Un scanner de
      # secrets affiche « 0 trouvé » quand il marche et « 0 trouvé » quand il ne
      # regarde rien : sans cette étape, le job ne distinguerait pas les deux.
      # Bloquante, à la différence du scan lui-même — elle ne dépend d'aucun
      # tiers, seulement du dépôt.
      - name: Modes de défaillance du scan de secrets
        run: bash scripts/verify-secret-scan.sh
      - name: Scan de secrets sur la plage du push ou de la PR
        # **Rapport, pas gate** (rule 21, étape 3). La vérification en ligne
        # appelle l'API du fournisseur : un gate qui rougit parce qu'AWS répond
        # mal est un gate qu'on désactive, et B2 tient déjà la porte d'entrée en
        # pre-commit. La bascule éventuelle se décidera sur du bruit mesuré.
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        # `pipefail` explicite, pour la même raison que dans le job e2e : sans
        # lui, le code de sortie observé serait celui de `tee`.
        run: |
          set -o pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          elif [ "$EVENT" = "push" ]; then
            HEAD="$PUSH_AFTER"
            # Première poussée d'une branche : `before` vaut quarante zéros et ne
            # désigne aucun commit. La plage devient toute l'histoire, ce qui est
            # le bon défaut — mieux vaut scanner deux fois qu'ouvrir une fenêtre.
            case "$PUSH_BEFORE" in
              0000000000000000000000000000000000000000) BASE="" ;;
              *) BASE="$PUSH_BEFORE" ;;
            esac
          else
            BASE=""; HEAD="HEAD"
          fi
          bash scripts/secret-scan.sh "$BASE" "$HEAD" 2>&1 | tee /tmp/secret-scan.log
      # Un rapport que personne ne lit ne rapporte rien — même leçon que pour le
      # verdict e2e. Le job ne bloquant pas, connaître son résultat imposerait
      # sinon d'ouvrir le journal d'un job vert, ce que personne ne fait.
      - name: Verdict du scan (résumé de run)
        if: always()
        run: |
          {
            echo "## Scan de secrets (rapport, non bloquant)"
            echo ""
            if [ -s /tmp/secret-scan.log ]; then
              sed -n '1,4p' /tmp/secret-scan.log | sed 's/^/- /'
            else
              echo "_Le scan n'a pas atteint son terme : voir le journal du job._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      - run: pnpm build

  audit:
    name: Audit vulnérabilités
    runs-on: ubuntu-latest
    needs: detect-changes
    # Sur le cron hebdomadaire, ou dès qu'un manifeste/lockfile change. always()
    # pour évaluer la condition même quand detect-changes est skippé (cron).
    if: always() && (github.event_name == 'schedule' || needs.detect-changes.outputs.deps == 'true')
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vulnérabilités de sévérité 'high' et plus, sur les deps de production.
      # Hors ci-success à dessein : filet de sécurité, pas un gate bloquant sur
      # une CVE transitive apparue en dehors du périmètre de la PR.
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level=high

  ci-success:
    name: CI success
    # L'unique check requis pour la protection de branche. Toujours exécuté pour
    # produire un statut, même si des jobs amont sont skippés (diff sans code).
    if: always()
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        quality,
        adr,
        doc-links,
        requirements,
        typecheck,
        test,
        integration,
        conformance,
        e2e,
        build,
      ]
    steps:
      # Liste **blanche**, et c'est tout l'intérêt : seuls `success` et `skipped`
      # laissent passer, tout autre statut — connu ou non — fait échouer le check.
      #
      # La garde précédente listait les statuts interdits (`failure`, `cancelled`).
      # Elle a laissé passer un run vert le 2026-08-06 alors que cinq jobs requis
      # (build, test, integration, requirements, adr) n'avaient jamais tourné :
      # faute de runner, GitHub leur avait donné le statut `abandoned`, absent de
      # la liste. Le seul check requis par la protection de branche annonçait donc
      # « tous les jobs requis sont passés » pour un run où la moitié n'avait pas
      # démarré (run 31127768013).
      #
      # Une liste noire échoue **ouverte** sur l'inattendu, et l'inattendu est
      # précisément ce contre quoi un gate existe. `skipped` reste accepté parce
      # qu'il est produit délibérément par `detect-changes` sur un diff sans code
      # (une PR de doc pure ne doit pas être bloquée) : c'est le seul statut
      # non-`success` dont on sait qu'il ne cache rien.
      - name: Vérifie que tout job requis a réussi ou a été délibérément skippé
        run: |
          failed=0
          for pair in \
            "quality=${{ needs.quality.result }}" \
            "adr=${{ needs.adr.result }}" \
            "doc-links=${{ needs['doc-links'].result }}" \
            "requirements=${{ needs.requirements.result }}" \
            "integration=${{ needs.integration.result }}" \
            "conformance=${{ needs.conformance.result }}" \
            "e2e=${{ needs.e2e.result }}" \
            "typecheck=${{ needs.typecheck.result }}" \
            "test=${{ needs.test.result }}" \
            "build=${{ needs.build.result }}"; do
            job="${pair%%=*}"
            r="${pair#*=}"
            case "$r" in
              success|skipped) ;;
              *)
                echo "::error::Job requis « $job » : statut « $r » (attendu success ou skipped)."
                failed=1
                ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "Au moins un job requis n'a pas réussi. Ce run n'atteste rien."
            exit 1
          fi
          echo "Tous les jobs requis sont passés (ou skippés faute de changement de code)."
