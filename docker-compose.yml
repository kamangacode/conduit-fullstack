# Stack de développement local Conduit — démarrage en une commande :
#
#   docker compose up -d
#
# Fournit les dépendances runtime dont l'API a besoin en local, sans rien
# installer sur la machine hôte :
#   - postgres : base de données (source de persistance de apps/api via Prisma)
#   - adminer  : UI web d'inspection de la base (http://localhost:8080)
#   - mailpit  : catcher SMTP + UI (http://localhost:8025) pour les e-mails de dev
#
# Les identifiants ci-dessous sont des valeurs de DÉVELOPPEMENT LOCAL uniquement,
# et ne servent qu'à ces conteneurs. Pour s'en écarter (port déjà pris, par
# exemple), copier `.env.example` en `.env` à la racine.
#
# La configuration du process API est ailleurs et validée par Zod au démarrage :
# `apps/api/.env.example` et `apps/api/src/config/env.ts`. En production, ces
# valeurs viennent de la plateforme (Railway), jamais du dépôt.
services:
  postgres:
    image: postgres:16-alpine
    container_name: conduit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conduit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conduit}
      POSTGRES_DB: ${POSTGRES_DB:-conduit_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - conduit_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Prisma migrate/connect échoue si Postgres n'est pas encore prêt : ce
      # healthcheck rend le "prêt" observable (utilisé par les hooks/CI plus tard).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conduit} -d ${POSTGRES_DB:-conduit_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base dédiée aux tests d'intégration, isolée de la base de dev.
  #
  # Sous un profile : `docker compose up -d` ne la démarre pas, seul
  # `scripts/test-integration.sh` la réclame. Un développeur qui lance la stack
  # de dev ne paie donc pas ce conteneur.
  #
  # `tmpfs` plutôt qu'un volume : les données vivent en mémoire et disparaissent
  # avec le conteneur. Une suite d'intégration doit partir d'un état connu ; un
  # volume persistant garderait les résidus d'un run précédemment interrompu, et
  # ces résidus produisent le pire des symptômes — une suite qui passe ou échoue
  # selon l'ordre des exécutions passées.
  #
  # Le nom de base contient « test » : `scripts/test-integration.sh` refuse de
  # purger une base dont le nom ne le contient pas (garde anti-TRUNCATE sur la dev).
  postgres-test:
    image: postgres:16-alpine
    container_name: conduit_postgres_test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-conduit}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-conduit}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-conduit_test}
    ports:
      - "${POSTGRES_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-conduit} -d ${POSTGRES_TEST_DB:-conduit_test}"]
      interval: 2s
      timeout: 3s
      retries: 30

  adminer:
    image: adminer:5
    container_name: conduit_adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  mailpit:
    # Version épinglée (pas de :latest) : un stack de dev doit être reproductible.
    image: axllent/mailpit:v1.27
    container_name: conduit_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  conduit_pgdata:
