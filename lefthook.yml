# Git hooks via Lefthook.
#
# Deux niveaux de garde-fou, du plus rapide au plus complet :
#   - pre-commit : vérifs rapides sur les fichiers staged (auto-format Biome +
#     garde secrets/.env). Doit rester quasi instantané.
#   - pre-push   : lint + typecheck + tests + validation des migrations sur un
#     Postgres jetable + vérif du verrou Biome. Dernier rempart avant le remote.
#
# Les conventional commits (commitlint) et le CHANGELOG sont traités en Phase 6.

pre-commit:
  parallel: true
  output:
    - meta
    - summary
    - failure
  commands:
    no-env-files:
      # Bloque tout fichier .env porteur de secrets, mais autorise les variants
      # documentaires (.env.example/.sample/.template/.test) committés à dessein.
      run: |
        # (^|/) : attrape aussi un .env NIÉ dans un sous-dossier (apps/api/.env),
        # pas seulement à la racine — sinon un `git add -f apps/api/.env` passe.
        if git diff --cached --name-only \
          | grep -E '(^|/)\.env($|\.)' \
          | grep -vE '\.(example|sample|template|test)$' \
          | grep -q .; then
          echo "ERREUR : fichier .env détecté dans le commit. Ajoutez-le à .gitignore."
          exit 1
        fi
    secret-guard:
      # Rejette tout diff ajoutant un secret à haute confiance : clé privée PEM,
      # JWT, clé d'accès AWS (AKIA), PAT GitHub (ghp_), clé secrète Stripe (sk_live).
      #
      # La logique vit dans un script et non ici (item B2) : un garde-fou qu'on ne
      # peut pas exécuter hors de son hook ne peut pas être mis en échec, donc pas
      # prouvé. `scripts/verify-secret-guard.sh` appelle ce même script en pre-push
      # et en CI — jamais une copie de ses motifs, qui ne prouverait que la copie.
      run: bash scripts/secret-guard.sh
    adr-convention:
      # Dès qu'un ADR bouge : numérotation unique, sections obligatoires, statut
      # valide et index à jour. Le contrôle porte sur tout le dossier (la
      # cohérence est globale : un index à jour ne se juge pas fichier par
      # fichier), le glob ne sert qu'à ne pas le déclencher sur chaque commit.
      glob: "docs/adr/*.md"
      run: bash scripts/check-adr-index.sh

    requirements-validate:
      # Dès qu'une exigence bouge : forme du frontmatter (Zod) et intégrité
      # (emplacement, unicité des ids, fichiers et ADR référencés). Bloquant :
      # un REQ mal formé n'a pas à entrer dans l'historique, il fausserait la
      # matrice de traçabilité dès la génération suivante.
      glob: "docs/requirements/**/*.{md,ts}"
      run: pnpm requirements:validate

    format:
      # Biome formate + corrige les fichiers staged et re-stage les corrections.
      # Un seul outil pour api et web (config racine).
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  # Sériel : évite la contention CPU entre lint/typecheck/test (source de flakes
  # sous les pools de process concurrents).
  parallel: false
  output:
    - meta
    - summary
    - failure
  commands:
    lint:
      run: bash .lefthook/run-quiet.sh 'CI=true pnpm lint'
    typecheck:
      run: bash .lefthook/run-quiet.sh 'CI=true pnpm typecheck'
    test:
      # turbo --concurrency=1 : @repo/api puis @repo/web séquentiels (déterminisme).
      # Vacant tant que les suites Vitest n'existent pas (Phase 4) — reste vert.
      run: bash .lefthook/run-quiet.sh 'CI=true pnpm exec turbo run test --concurrency=1'
    migrations-apply:
      # Applique les nouvelles migrations Prisma sur un Postgres jetable pour
      # attraper une erreur SQL avant le push. No-op si aucune migration n'est
      # poussée. Non-bloquant si docker est absent (voir le script).
      run: bash .lefthook/check-migrations.sh
    requirements-typecheck:
      # `pnpm typecheck` passe par turbo, qui ne voit que les workspaces : les
      # scripts d'exigences vivent dans docs/ et y échapperaient.
      run: bash .lefthook/run-quiet.sh 'CI=true pnpm requirements:typecheck'

    verify-requirements:
      # Vérifie sur des fixtures que le validateur rejette bien ce qu'il annonce
      # et que la matrice relie réellement les critères aux tests (~10s). Même
      # logique que le verrou Biome ci-dessous : on ne fait pas confiance à la
      # déclaration d'un garde-fou, on le met en échec.
      run: bash .lefthook/run-quiet.sh 'CI=true pnpm requirements:verify'

    verify-biome-verrou:
      # Vérifie en local que le verrou hard-fail Biome est toujours actif
      # (~5s). Empêche un push qui aurait silencieusement dégradé biome.json.
      run: bash scripts/verify-biome-hardfail.sh

    verify-secret-guard:
      # Soumet au garde-fou de secrets un exemplaire de chacune des cinq familles
      # qu'il prétend refuser, dans un dépôt git jetable (REQ-SEC-001).
      #
      # Un garde-fou de secrets est silencieux quand il marche ET quand il est
      # cassé : un commit qui passe ne dit pas s'il a examiné le diff ou s'il a
      # sorti 0 sur une liste de fichiers vide. La seule preuve est de lui
      # soumettre un vrai secret et de constater le refus.
      #
      # La vérification porte aussi ses contrôles négatifs — exclusions, code
      # ordinaire, suppression d'un secret — parce qu'un garde-fou qui refuse
      # tout se fait contourner par `--no-verify` avant la fin de la semaine.
      run: bash scripts/verify-secret-guard.sh

    verify-sql-raw-guard:
      # Soumet au verrou SQL les trois formes d'appel qu'il prétend refuser, et
      # les formes paramétrées qu'il doit laisser passer (REQ-SEC-002, ADR 024).
      #
      # Même raison qu'au-dessus, aggravée d'un cran : le verrou est un plugin
      # GritQL, et un plugin qui ne compile pas est rapporté par Biome en `info`
      # avec un code de sortie **0**. `pnpm lint` reste donc vert pendant que le
      # motif ne matche plus rien — vérifié en sabotant la regex. La présence du
      # fichier ne prouve rien ; seul un refus effectif le fait.
      run: bash scripts/verify-sql-raw-guard.sh

    verify-env-fail-fast:
      # Démarre le point d'entrée réel de l'API sur cinq configurations invalides
      # et exige un arrêt qui nomme la variable fautive (REQ-SEC-004, ADR 025).
      #
      # Le mécanisme existait depuis B1 et ses 12 tests unitaires passaient : ce
      # qu'ils ne pouvaient pas voir, c'est que la validation s'exécutait APRÈS le
      # chargement du graphe applicatif, lequel charge `.env` par un effet de bord
      # de `@prisma/client`. Un `.env` sur le disque comblait donc la variable
      # oubliée, et l'API démarrait sans `DATABASE_URL` ni `JWT_SECRET`. Une
      # fonction pure n'a pas d'ordre d'exécution vis-à-vis d'un graphe d'imports
      # — seul un démarrage réel le montre.
      #
      # La vérification porte son contrôle positif (une configuration valide doit
      # être acceptée, sinon un garde-fou qui refuse tout passerait) et son
      # contrôle négatif (l'ancien ordre doit être vu démarrer, sinon le harnais
      # ne prouve pas ce qu'il annonce).
      #
      # `glob` restreint la tâche à ce qu'elle peut prouver : un push qui ne
      # touche qu'un ADR n'a pas à payer sept démarrages de process.
      glob:
        - 'apps/api/**'
        - 'scripts/verify-env-fail-fast.sh'
      run: bash scripts/verify-env-fail-fast.sh

    verify-type-boundary:
      # Casse volontairement le modèle partagé et vérifie que les DEUX
      # applications refusent de compiler (REQ-ARCH-001). C'est la thèse du
      # dépôt : la cohérence front/back est une dépendance de compilation, pas
      # une intention. Une thèse qu'on n'éprouve pas devient fausse en silence
      # le jour où quelqu'un recopie un type au lieu de l'importer.
      #
      # Le script restaure le modèle **et reconstruit `shared`** par trap, y
      # compris en cas d'échec : les applications consomment le paquet compilé,
      # et le laisser cassé rendrait le dépôt inutilisable sans que `git status`
      # ne montre quoi que ce soit.
      #
      # `glob` restreint la tâche aux workspaces qu'elle peut prouver, comme le
      # filtre `code` de `detect-changes` le fait en CI. Sans lui, le local
      # était plus large que le distant — un push qui ne touche qu'un ADR payait
      # une vérification qui n'avait rien à vérifier, et l'en-tête de `ci.yml`
      # revendique pourtant que la CI est le miroir des garde-fous locaux.
      glob:
        - 'packages/shared/**'
        - 'apps/api/**'
        - 'apps/web/**'
        - 'scripts/verify-type-boundary.sh'
      run: bash scripts/verify-type-boundary.sh
